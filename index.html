<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Films & Listes Letterboxd - Oni Lechan</title>
<link rel="stylesheet" href="chef_d_oeuvre.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<header class="main-header">
    <div class="container">
        <h1 class="site-title">CritiqueBox</h1>
        <a href="https://letterboxd.com/oni_le_chan/" target="_blank" class="letterboxd-link">Mon Profil Letterboxd</a>
        <a href="https://l-oeil-critique.netlify.app/" target="_blank" class="letterboxd-link">Retour à l'Accueil</a>
    </div>
</header>

<main class="main-content">

    <!-- Critiques -->
    <section class="critiques-films">
        <div class="container">
            <h2 class="section-title">Dernières Critiques</h2>
            <div class="film-grid" id="reviews-container">
                <!-- Les cartes films générées par Python seront insérées ici -->
            </div>
        </div>
    </section>

</main>

<footer class="main-footer">
    <div class="container">
        <p>&copy; 2025 Oni Lechan. Données via Letterboxd RSS.</p>
    </div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // Conteneurs
    const reviewsContainer = document.getElementById('reviews-container');
    const listsContainer = document.getElementById('lists-container');

    // Fonction pour charger un fichier HTML externe
    function loadHTML(url, container) {
        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error(`Impossible de charger ${url}`);
                return res.text();
            })
            .then(html => {
                container.innerHTML = html;
            })
            .catch(err => {
                container.innerHTML = `<p class="error-message">${err}</p>`;
                console.error(err);
            });
    }

    // Charger films et listes
    loadHTML('films.html', reviewsContainer);
    loadHTML('lists.html', listsContainer);
});
</script>
</body>
</html>
